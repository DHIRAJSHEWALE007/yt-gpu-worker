[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-gpu-worker"
version = "1.0.0"
description = "Decoupled headless GPU worker for diffusion image and video pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "httpx>=0.25.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "diffusers>=0.26.0",
    "transformers>=4.36.0",
    "accelerate>=0.26.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.1.99",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
